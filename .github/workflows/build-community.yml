# Track caller: Build Community Images. Thin wrapper over complete-artifact-matrix.yml.
name: "Build Community Images"

on:
  schedule:
    - cron: '0 23 * * THU' # migrated from armbian/os (complete-artifact-matrix-community-maintained)
  workflow_dispatch:
    # Only the values that actually vary per run are exposed. Everything else
    # (skipImages=no, checkOci=yes, nightlybuild=yes, extra params, targets
    # filter) is fixed via the *_default / empty fallbacks that complete-artifact-
    # matrix.yml reads — i.e. the same values a scheduled run gets.
    inputs:
      branch:
        description: 'Framework build branch'
        type: string
        default: 'main'
      forceDockerPull:
        description: 'Force fresh Docker image pull? yes = pull latest (default for manual runs), no = use cached'
        type: choice
        options: [ 'yes', 'no' ]
        default: 'yes'
      versionOverride:
        description: 'Version override'
        type: string
        default: ''

concurrency:
  group: ${{ github.run_id }}-unsupportedstable
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/complete-artifact-matrix.yml
    with:
      release_repository: "community"
      # Community owns its version series + releases in armbian/community, so it
      # reads/bumps its own -trunk.N and publishes there instead of reusing
      # nightly's version out of the shared repo.
      release_target_repository: "armbian/community"
      target_path: "community/"
      team: "Release manager"
      repository_ref: "stable"
      prepare_config: "armbian-community"
      targets_filename: "targets-release-community-maintained.yaml"
      skipimages_default: "no"
      checkoci_default: "yes"
      nightlybuild_default: "yes"
    secrets: inherit
