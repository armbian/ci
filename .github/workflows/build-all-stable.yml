# Track caller: Build All Stable Artifacts. Thin wrapper over complete-artifact-matrix.yml.
name: "Build All Stable Artifacts"

on:
  schedule:
    - cron: '0 2 * * *' # migrated from armbian/os (complete-artifact-matrix-all-stable)
  workflow_dispatch:
    inputs:
      skipImages:
        description: 'Skip building images? no = build images, yes = skip images'
        type: choice
        options: [ 'yes', 'no' ]
        default: 'yes'
      checkOci:
        description: 'Check OCI for existing artifacts? yes = check OCI, no = always build everything'
        type: choice
        options: [ 'yes', 'no' ]
        default: 'yes'
      extraParamsAllBuilds:
        description: 'Extra params for all builds/jobs (eg: DEBUG=yes)'
        type: string
        default: ''
      branch:
        description: 'Framework build branch'
        type: string
        default: 'main'
      forceDockerPull:
        description: 'Force fresh Docker image pull? yes = pull latest (default for manual runs), no = use cached'
        type: choice
        options: [ 'yes', 'no' ]
        default: 'yes'
      targetsFilterInclude:
        description: 'TARGETS_FILTER_INCLUDE, example: "BOARD:odroidhc4,BOARD:odroidn2"'
        type: string
        default: ''
      nightlybuild:
        description: 'yes = nightly, no = stable'
        type: choice
        options: [ 'yes', 'no' ]
        default: 'no'
      versionOverride:
        description: 'Version override'
        type: string
        default: ''

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/complete-artifact-matrix.yml
    with:
      release_repository: "os"
      target_path: "stable/"
      team: "Board Maintainers"
      repository_ref: "all"
      prepare_config: "armbian-images"
      targets_filename: "targets-all-not-eos.yaml"
      skipimages_default: "yes"
      checkoci_default: "yes"
      nightlybuild_default: "no"
    secrets: inherit
