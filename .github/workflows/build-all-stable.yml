# Track caller: Build All Stable Artifacts. Thin wrapper over complete-artifact-matrix.yml.
name: "Build All Stable Artifacts"

on:
  schedule:
    - cron: '0 18 * * 1' # Mondays 18:00 UTC (weekly stable rebuild, auto-bumps the patch version)
  # No inputs: every knob is fixed for the weekly stable rebuild - skipImages=yes,
  # checkOci=yes, nightlybuild=no (stable), branch=main, no targets filter, no
  # extra params, cached Docker image (a scheduled run never force-pulls), and
  # stable_bump=yes so each run cuts the next patch (X.Y.Z -> X.Y.(Z+1)). Those are
  # the *_default / empty fallbacks complete-artifact-matrix.yml reads, so a manual
  # run behaves exactly like the scheduled one.
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/complete-artifact-matrix.yml
    with:
      release_repository: "os"
      target_path: "stable/"
      team: "Board Maintainers"
      repository_ref: "all"
      prepare_config: "armbian-images"
      targets_filename: "targets-all-not-eos.yaml"
      skipimages_default: "yes"
      checkoci_default: "yes"
      nightlybuild_default: "no"
      stable_bump: "yes"
    secrets: inherit
