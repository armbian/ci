# Track caller: Build All Stable Artifacts. Thin wrapper over complete-artifact-matrix.yml.
name: "Build All Stable Artifacts"

on:
  schedule:
    - cron: '0 18 * * 1' # Mondays 18:00 UTC (weekly stable rebuild, auto-bumps the patch version)
  # No inputs: every knob is fixed for the weekly stable rebuild. Packages only -
  # skipImages=yes (NO images), artifacts go to OCI - but stable_bump=yes still cuts
  # a new stable release each run: X.Y.Z -> X.Y.(Z+1). That release is what persists
  # the bump (the next run reads it as the latest X.Y.Z and increments past it), the
  # same way nightly's image release persists its -trunk.N counter - just without
  # building images. Other fixed values: checkOci=yes, nightlybuild=no (stable),
  # branch=main, no targets filter, no extra params, cached Docker image (a scheduled
  # run never force-pulls) - all the *_default / empty fallbacks complete-artifact-
  # matrix.yml reads, so a manual run behaves exactly like the scheduled one.
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/complete-artifact-matrix.yml
    with:
      release_repository: "os"
      target_path: "stable/"
      team: "Board Maintainers"
      repository_ref: "all"
      prepare_config: "armbian-images"
      targets_filename: "targets-all-not-eos.yaml"
      skipimages_default: "yes"
      checkoci_default: "yes"
      nightlybuild_default: "no"
      stable_bump: "yes"
      # The chain ends with base-files; that job dispatches the one repository
      # update, so the packages and the base-files land in the same rebuild.
      repository_update: "no"
    secrets: inherit

  # Base-files last: they are built at the current stable version, so they have
  # to follow the version bump this run just made. Its own repository_update
  # (default "yes") is what asks armbian.github.io to rebuild the repositories.
  base-files:
    name: "Base files"
    needs: build
    # Explicitly require success. !failure()/!cancelled() are status-check
    # functions, and using one overrides the default "needs must have
    # succeeded" gate - a skipped build would still have let this run, and
    # this is the job that dispatches the repository update.
    if: ${{ needs.build.result == 'success' }}
    uses: ./.github/workflows/build-base-files.yml
    secrets: inherit
