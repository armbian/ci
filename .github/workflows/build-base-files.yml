# Track caller: Build Base Files. Thin wrapper over complete-artifact-matrix.yml.
# Builds ONLY the armbian-base-files artifact for all not-eos releases × standard
# arches, at the current stable version, and uploads them under base-files/.
# See armbian/build#9476 (base-files missing for some release/arch combos).
#
# No schedule of its own: base-files are built at the current stable version, so
# they belong to the weekly stable run and are built as its final stage. It used
# to run daily, which rebuilt nothing (checkOci found everything in OCI - 33 of
# 38 jobs skipped on a typical run) but still dispatched a full repository
# rebuild every morning. Run it manually if base-files need to be regenerated
# between stable builds.
name: "Build Base Files"

on:
  # Called by build-all-stable as its last stage: that run builds with
  # repository_update=no, then calls this, and this call issues the single
  # repository update - so packages and base-files publish together.
  workflow_call:
    inputs:
      repository_update:
        description: 'Ask armbian.github.io to rebuild the apt repositories when done'
        required: false
        type: string
        default: 'yes'
  workflow_dispatch:
    inputs:
      checkOci:
        description: 'Check OCI for existing artifacts? yes = check OCI, no = always build everything'
        type: choice
        options: [ 'yes', 'no' ]
        default: 'yes'
      extraParamsAllBuilds:
        description: 'Extra params for all builds/jobs (eg: DEBUG=yes)'
        type: string
        default: ''
      branch:
        description: 'Framework build branch'
        type: string
        default: 'main'
      forceDockerPull:
        description: 'Force fresh Docker image pull? yes = pull latest (default for manual runs), no = use cached'
        type: choice
        options: [ 'yes', 'no' ]
        default: 'yes'
      targetsFilterInclude:
        description: 'TARGETS_FILTER_INCLUDE, example: "RELEASE:trixie,ARCH:armhf"'
        type: string
        default: ''
      versionOverride:
        description: 'Version override'
        type: string
        default: ''

concurrency:
  group: pipeline-base-files
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/complete-artifact-matrix.yml
    with:
      release_repository: "os"
      target_path: "base-files/"
      team: "Board Maintainers"
      repository_ref: "all"
      prepare_config: "armbian-images"
      targets_filename: "targets-base-files.yaml"
      skipimages_default: "yes"
      checkoci_default: "yes"
      nightlybuild_default: "no"
      # Undefined on schedule/dispatch runs, so those keep updating the repo.
      repository_update: ${{ inputs.repository_update || 'yes' }}
    secrets: inherit
