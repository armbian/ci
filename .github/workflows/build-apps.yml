# Track caller: Build Apps Images. Thin wrapper over complete-artifact-matrix.yml.
name: "Build Apps Images"

on:
  # Stable image build: nightlybuild is fixed to "no". Only the useful controls
  # are exposed; skipImages=no, checkOci=yes and extra params fall back to the
  # *_default / env values complete-artifact-matrix.yml reads.
  workflow_dispatch:
    inputs:
      branch:
        description: 'Framework build branch'
        type: string
        default: 'main'
      forceDockerPull:
        description: 'Force fresh Docker image pull? yes = pull latest (default for manual runs), no = use cached'
        type: choice
        options: [ 'yes', 'no' ]
        default: 'yes'
      targetsFilterInclude:
        description: 'TARGETS_FILTER_INCLUDE, example: "BOARD:odroidhc4,BOARD:odroidn2"'
        type: string
        default: ''
      versionOverride:
        description: 'Version override'
        type: string
        default: ''

concurrency:
  group: ${{ github.run_id }}-appsapps
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/complete-artifact-matrix.yml
    with:
      release_repository: "distribution"
      target_path: "apps/"
      team: "Release manager"
      repository_ref: "stable"
      prepare_config: "armbian-images"
      targets_filename: "targets-release-apps.yaml"
      skipimages_default: "no"
      checkoci_default: "yes"
      nightlybuild_default: "no"
    secrets: inherit
