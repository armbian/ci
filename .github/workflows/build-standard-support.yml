# Track caller: Build Standard Support Images (admin). Thin wrapper over complete-artifact-matrix.yml.
name: "Build Standard Support Images (admin)"

on:
  workflow_dispatch:
    inputs:
      skipImages:
        description: 'Skip building images? no = build images, yes = skip images'
        type: choice
        options: [ 'yes', 'no' ]
        default: 'no'
      checkOci:
        description: 'Check OCI for existing artifacts? yes = check OCI, no = always build everything'
        type: choice
        options: [ 'yes', 'no' ]
        default: 'yes'
      extraParamsAllBuilds:
        description: 'Extra params for all builds/jobs (eg: DEBUG=yes)'
        type: string
        default: ''
      branch:
        description: 'Framework build branch'
        type: string
        default: 'main'
      forceDockerPull:
        description: 'Force fresh Docker image pull? yes = pull latest (default for manual runs), no = use cached'
        type: choice
        options: [ 'yes', 'no' ]
        default: 'yes'
      targetsFilterInclude:
        description: 'TARGETS_FILTER_INCLUDE, example: "BOARD:odroidhc4,BOARD:odroidn2"'
        type: string
        default: ''
      nightlybuild:
        description: 'yes = nightly, no = stable'
        type: choice
        options: [ 'yes', 'no' ]
        default: 'no'
      versionOverride:
        description: 'Version override'
        type: string
        default: ''

concurrency:
  group: ${{ github.run_id }}-standard-supportstable
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/complete-artifact-matrix.yml
    with:
      release_repository: "os"
      target_path: "stable/"
      team: "Release manager"
      repository_ref: "stable"
      prepare_config: "armbian-images"
      targets_filename: "targets-release-standard-support.yaml"
      skipimages_default: "no"
      checkoci_default: "yes"
      nightlybuild_default: "no"
    secrets: inherit
