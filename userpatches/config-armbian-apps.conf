display_alert "Common settings for Armbian Application images" "setting default values" "info"

# Apps build into the SHARED OCI artifact cache produced by the OS-images config
# (config-armbian-images.conf). Every artifact-affecting setting below MUST match
# that config or the kernel/bsp/rootfs hashes differ and each one is rebuilt from
# scratch instead of reused. Keep this block in sync with config-armbian-images.conf.
# The app-specific settings (BSPFREEZE, DONT_BUILD_ARTIFACTS) are image-time only
# and do NOT change any artifact hash, so they are safe.
declare -g USE_MAINLINE_GOOGLE_MIRROR="yes"
declare -g ARMBIAN_DOCKER_AUTO_PULL=yes
declare -g SYNC_CLOCK="no"
declare -g INSTALL_HEADERS="no"
declare -g WIREGUARD="no"
declare -g KERNEL_BTF="yes"
declare -g VENDOR="Armbian"
declare -g VENDORCOLOR="247;16;0"
declare -g VENDORURL="https://www.armbian.com"
declare -g VENDORDOCS="https://docs.armbian.com"
declare -g VENDORSUPPORT="https://forum.armbian.com"
declare -g VENDORPRIVACY="https://www.armbian.com"
declare -g VENDORBUGS="https://www.armbian.com/bugs"
declare -g VENDORLOGO="armbian-logo"
declare -g MAINTAINERMAIL=info@armbian.com
declare -g MAINTAINER="Armbian Linux"
declare -g COMPRESS_OUTPUTIMAGE="sha,img,xz"
declare -g IMAGE_XZ_COMPRESSION_RATIO=8
declare -g EXPERT="yes"
declare -g KERNEL_CONFIGURE=no

# Same Docker base image as the OS-images config -> one image, shared artifacts.
DOCKER_ARMBIAN_BASE_IMAGE="debian:trixie"

declare -g PREFER_DOCKER="yes"

# App-specific, image-time only (no artifact-hash impact):
#  - BSPFREEZE: hold kernel/bsp packages in the appliance image
#  - DONT_BUILD_ARTIFACTS: also skip building armbian-config (pulled from the cache)
declare -g BSPFREEZE="yes"
declare -g DONT_BUILD_ARTIFACTS="kernel,firmware,full_firmware,fake_ubuntu_advantage_tools,armbian-config,armbian-zsh,armbian-plymouth-theme"
